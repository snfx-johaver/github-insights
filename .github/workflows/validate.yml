name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/validate_scaffold.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: python scripts/build_release.py
      - run: python scripts/validate_release_artifact.py

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python -m json.tool hacs.json > /dev/null
      - run: python -m json.tool custom_components/github_insights/manifest.json > /dev/null
      - run: python -m json.tool custom_components/github_insights/strings.json > /dev/null
      - run: python -m json.tool custom_components/github_insights/translations/en.json > /dev/null
