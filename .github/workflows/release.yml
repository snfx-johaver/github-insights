name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: python scripts/build_release.py
      - run: python scripts/validate_release_artifact.py
      - run: python scripts/check_release_readiness.py
      - name: Determine release type
        id: release-type
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          notes="docs/release-notes-${version}.md"
          test -f "$notes"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          sha256sum github_insights.zip > github_insights.zip.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/github_insights.zip
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.release-type.outputs.notes }}
          generate_release_notes: true
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          files: |
            dist/github_insights.zip
            dist/github_insights.zip.sha256
