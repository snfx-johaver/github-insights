name: Bug report
description: Report a reproducible GitHub Insights defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Never include tokens, authorization headers, or unsanitized diagnostics.
  - type: input
    id: version
    attributes:
      label: GitHub Insights version
    validations:
      required: true
  - type: input
    id: home_assistant
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or diagnostics

