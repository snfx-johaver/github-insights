title: GitHub Insights
views:
  - title: Overview
    path: overview
    icon: mdi:github
    cards:
      - type: custom:github-insights-card
        title: GitHub Insights
        preset: dashboard
        layout: expanded
        sections:
          - overview
          - usage
          - actions
          - copilot
          - activity
          - contributions
          - security
        show_forecast: true
        show_estimated_minutes: true

      - type: custom:github-insights-repository-card
        title: Repository operations
        repositories: auto
        layout: compact
        group_by: organization
        sort:
          - field: workflow_health
            direction: ascending
            nulls: last
          - field: last_push
            direction: descending
            nulls: last
          - field: name
            direction: ascending
            nulls: last
        metrics:
          - stars
          - open_issues
          - open_pull_requests
          - workflow_health
          - actions_usage_percent

  - title: All entities
    path: entities
    icon: mdi:view-list
    cards:
      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          title: Sensors and controls
          show_header_toggle: false
        filter:
          include:
            - entity_id: sensor.github_insights_*
            - entity_id: binary_sensor.github_insights_*
            - entity_id: number.github_insights_*
            - entity_id: select.github_insights_*
            - entity_id: switch.github_insights_*
            - entity_id: button.github_insights_*
        sort:
          method: name
          ignore_case: true
