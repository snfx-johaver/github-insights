title: GitHub Insights
views:
  - title: Overview
    path: overview
    icon: mdi:github
    cards:
      - type: custom:mushroom-title-card
        title: GitHub Insights
        subtitle: Your GitHub pulse, right at home.

      - type: custom:auto-entities
        show_empty: false
        card:
          type: custom:mushroom-chips-card
          alignment: justify
        card_param: chips
        filter:
          include:
            - entity_id: sensor.github_insights_*public_repositories
              options:
                type: entity
                icon: mdi:source-repository
                content_info: state
            - entity_id: sensor.github_insights_*organizations
              options:
                type: entity
                icon: mdi:account-group
                content_info: state
            - entity_id: sensor.github_insights_*followers
              options:
                type: entity
                icon: mdi:account-multiple
                content_info: state
            - entity_id: sensor.github_insights_*api_rate_limit_remaining
              options:
                type: entity
                icon: mdi:api
                content_info: state

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Account snapshot
              show_header_toggle: false
            filter:
              include:
                - entity_id: sensor.github_insights_*account
                - entity_id: sensor.github_insights_*public_repositories
                - entity_id: sensor.github_insights_*private_repositories
                - entity_id: sensor.github_insights_*organizations
                - entity_id: sensor.github_insights_*followers
                - entity_id: sensor.github_insights_*following
                - entity_id: sensor.github_insights_*last_successful_sync
            sort:
              method: name
              ignore_case: true

          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: API capacity
              show_header_toggle: false
            filter:
              include:
                - entity_id: sensor.github_insights_*api_rate_limit_remaining
                - entity_id: sensor.github_insights_*api_rate_limit_reset
            sort:
              method: name
              ignore_case: true

      - type: custom:auto-entities
        show_empty: false
        card:
          type: custom:apexcharts-card
          header:
            show: true
            title: API capacity over time
            show_states: true
            colorize_states: true
          graph_span: 24h
          update_interval: 5min
        card_param: series
        filter:
          include:
            - entity_id: sensor.github_insights_*api_rate_limit_remaining
              options:
                name: Requests remaining
                type: line
                stroke_width: 3
                group_by:
                  duration: 15min
                  func: last

      - type: markdown
        content: >-
          The integration files are updated, but Home Assistant is still running the
          previous entity set. After a supported Home Assistant restart and config-entry
          reload, newly available repository, Actions, billing, security, and Copilot
          entities will appear automatically on the **All entities** tab.

  - title: All entities
    path: entities
    icon: mdi:view-list
    cards:
      - type: custom:mushroom-title-card
        title: Available GitHub Insights entities
        subtitle: This list grows automatically as capabilities become available.

      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          title: Sensors and controls
          show_header_toggle: false
        filter:
          include:
            - entity_id: sensor.github_insights_*
            - entity_id: binary_sensor.github_insights_*
            - entity_id: number.github_insights_*
            - entity_id: select.github_insights_*
            - entity_id: switch.github_insights_*
            - entity_id: button.github_insights_*
        sort:
          method: name
          ignore_case: true

      - type: markdown
        content: >-
          Bundled GitHub Insights cards remain part of this single integration. They
          can be added back after `/github_insights/frontend/github-insights-cards.js`
          is registered as a Lovelace module through Home Assistant's supported UI or
          WebSocket API.
